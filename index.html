<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Wolf Scorecard</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wolf Scorecard">
<meta name="theme-color" content="#1B4332">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fairway:#1B4332;
    --fairway-light:#2F6B4F;
    --fairway-dark:#122C21;
    --parchment:#F4EFDD;
    --parchment-dim:#ECE4C8;
    --ink:#1F2A24;
    --ink-soft:#5B6660;
    --gold:#C9A227;
    --gold-soft:#E9D48A;
    --red:#B23A2F;
    --green-score:#2E7D46;
    --line:#D8CFB0;
    --white:#FFFDF7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--fairway-dark);
    font-family:'Inter',sans-serif; color:var(--ink);
    display:flex; justify-content:center;
  }
  #app{
    width:100%; max-width:520px; min-height:100vh;
    background:var(--parchment);
    display:flex; flex-direction:column;
    position:relative;
    box-shadow:0 0 40px rgba(0,0,0,.4);
  }
  .app-header{
    background:var(--fairway);
    color:var(--white);
    padding:14px 16px 16px;
    position:sticky; top:0; z-index:30;
    box-shadow:0 2px 10px rgba(0,0,0,.25);
  }
  .brandrow{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand{display:flex; align-items:center; gap:9px;}
  .brand svg{width:44px; height:44px; flex-shrink:0;}
  .brand-text{font-family:'Anton',sans-serif; font-size:22px; letter-spacing:.5px; line-height:1;}
  .brand-sub{font-size:10px; letter-spacing:2.5px; text-transform:uppercase; color:var(--gold-soft); margin-top:2px;}
  .icon-btn{
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);
    color:var(--white); width:36px; height:36px; border-radius:10px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-btn:active{background:rgba(255,255,255,.2);}
  .icon-btn svg{width:18px;height:18px;}
  .icon-btn-locked{background:var(--gold); border-color:var(--gold); color:var(--fairway-dark);}
  .icon-btn-locked:active{background:#B5911F;}
  .locked-disabled{opacity:.45; pointer-events:none; filter:grayscale(.3);}
  .locked-banner{
    display:flex; align-items:center; gap:8px; background:var(--gold-soft); color:var(--fairway-dark);
    border-radius:11px; padding:10px 12px; margin-bottom:12px; font-size:12.5px; font-weight:700;
  }
  .locked-banner svg{width:16px; height:16px; flex-shrink:0;}
  .round-meta{
    margin-top:12px; display:flex; justify-content:space-between; align-items:baseline;
    font-family:'IBM Plex Mono',monospace;
  }
  .round-meta .course{font-size:15px; font-weight:600; color:var(--white);}
  .round-meta .date{font-size:12px; color:rgba(255,255,255,.65);}

  main{flex:1; padding:14px 14px 90px; overflow-y:auto;}
  .hidden{display:none !important;}

  /* Buttons */
  .btn{
    font-family:'Inter',sans-serif; font-weight:700; font-size:14px;
    border:none; border-radius:11px; padding:12px 16px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-primary{background:var(--fairway); color:var(--white);}
  .btn-primary:active{background:var(--fairway-dark);}
  .btn-gold{background:var(--gold); color:var(--fairway-dark);}
  .btn-gold:active{background:#B5911F;}
  .btn-ghost{background:transparent; color:var(--fairway); border:1.5px solid var(--fairway);}
  .btn-danger-ghost{background:transparent; color:var(--red); border:1.5px solid var(--red);}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 12px; font-size:12.5px; border-radius:9px;}

  /* Cards */
  .card{
    background:var(--white); border-radius:16px; padding:16px;
    margin-bottom:14px; border:1px solid var(--line);
  }
  .card-title{
    font-family:'Anton',sans-serif; font-size:15px; letter-spacing:.4px;
    color:var(--fairway); margin:0 0 12px; text-transform:uppercase;
  }
  label.field-label{
    display:block; font-size:11px; font-weight:700; text-transform:uppercase;
    letter-spacing:.6px; color:var(--ink-soft); margin-bottom:5px;
  }
  input[type=text], input[type=date], input[type=number]{
    width:100%; border:1.5px solid var(--line); border-radius:10px;
    padding:10px 12px; font-size:15px; font-family:'Inter',sans-serif;
    background:var(--white); color:var(--ink);
  }
  input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .field{margin-bottom:12px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}

  .player-input-row{
    display:flex; align-items:center; gap:10px; margin-bottom:10px;
  }
  .player-swatch{
    width:30px; height:30px; border-radius:8px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12px; color:var(--white);
  }
  .player-sub-row{display:flex; gap:10px; margin:0 0 14px 40px;}
  .player-sub-field{display:flex; flex-direction:column; gap:4px;}
  .player-sub-field label{font-size:9px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.4px; font-weight:700;}
  .player-sub-field input{width:72px; text-align:center; padding:7px 4px;}

  /* Pars row */
  .par-grid{display:grid; grid-template-columns:repeat(9,1fr); gap:5px;}
  .par-cell{text-align:center;}
  .par-cell input{padding:8px 2px; text-align:center; font-family:'IBM Plex Mono',monospace; font-weight:600;}
  .par-cell span{display:block; font-size:9px; color:var(--ink-soft); margin-bottom:3px; font-weight:700;}
  .par-cell .yd-input{margin-top:4px; padding:6px 2px; font-size:11px; font-weight:500; color:var(--ink-soft);}

  /* Hole navigator */
  .hole-nav{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px; gap:10px;
  }
  .hole-badge{
    width:56px; height:56px; border-radius:50%;
    background:var(--fairway); color:var(--white);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Anton',sans-serif; flex-shrink:0; border:3px solid var(--gold);
    cursor:pointer; padding:0;
  }
  .hole-badge:active{background:var(--fairway-dark);}
  .hole-badge .num{font-size:22px; line-height:1;}
  .hole-badge .lbl{font-size:7px; letter-spacing:1px; text-transform:uppercase; opacity:.8;}
  .hole-pick-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:9px; margin-bottom:6px;}
  .hole-pick-btn{
    aspect-ratio:1; border-radius:12px; border:1.5px solid var(--line);
    background:var(--white); display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; cursor:pointer; gap:1px;
  }
  .hole-pick-btn .n{font-size:16px; font-weight:700; color:var(--ink);}
  .hole-pick-btn .p{font-size:8px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.3px;}
  .hole-pick-btn.done{background:var(--parchment-dim); border-color:var(--fairway-light);}
  .hole-pick-btn.current{background:var(--fairway); border-color:var(--gold); border-width:2px;}
  .hole-pick-btn.current .n, .hole-pick-btn.current .p{color:var(--white);}
  .hole-pick-divider{font-size:10px; font-weight:700; letter-spacing:1px; color:var(--ink-soft); text-transform:uppercase; margin:12px 0 8px;}
  .backup-textarea{
    width:100%; min-height:140px; border:1.5px solid var(--line); border-radius:10px;
    padding:10px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink);
    background:var(--white); resize:vertical;
  }
  .segmented{display:flex; background:var(--parchment-dim); border-radius:11px; padding:3px; gap:3px; margin-bottom:14px;}
  .segmented button{flex:1; border:none; background:transparent; padding:9px 0; border-radius:8px; font-size:13px; font-weight:700; color:var(--ink-soft); cursor:pointer;}
  .segmented button.active{background:var(--white); color:var(--fairway); box-shadow:0 1px 2px rgba(0,0,0,.1);}
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .spinner{
    width:40px; height:40px; border-radius:50%; border:4px solid var(--line);
    border-top-color:var(--fairway); margin:0 auto 16px; animation:spin .8s linear infinite;
  }
  .scan-banner{
    display:flex; gap:8px; align-items:flex-start; background:#EAF1EC; border:1px solid var(--fairway-light);
    border-radius:10px; padding:10px 12px; margin:-6px 0 14px; font-size:12px; color:var(--fairway-dark);
  }
  .nav-arrow{
    background:var(--white); border:1.5px solid var(--fairway); color:var(--fairway);
    width:42px; height:42px; border-radius:11px; display:flex; align-items:center;
    justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .nav-arrow:active{background:var(--fairway); color:var(--white);}
  .nav-arrow.disabled{opacity:.3; pointer-events:none;}
  .nav-arrow svg{width:20px;height:20px;}
  .par-pill{
    flex:1; text-align:center; font-family:'IBM Plex Mono',monospace;
    background:var(--parchment-dim); border-radius:11px; padding:8px 4px;
  }
  .par-pill .p{font-size:20px; font-weight:700; color:var(--fairway);}
  .par-pill .l{font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-soft);}

  .hole-dots{display:flex; justify-content:center; gap:5px; margin:-2px 0 14px;}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--line); cursor:pointer;}
  .dot.done{background:var(--fairway-light);}
  .dot.active{background:var(--gold); width:16px; border-radius:4px;}

  /* Player score row */
  .score-row{
    display:flex; align-items:center; gap:10px; padding:9px 0;
    border-bottom:1px solid var(--line);
  }
  .score-row:last-child{border-bottom:none;}
  .p-tag{
    width:34px; height:34px; border-radius:9px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12px; color:var(--white);
  }
  .p-name{flex:1; font-size:14.5px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .stepper{display:flex; align-items:center; gap:0; background:var(--parchment); border-radius:10px; border:1.5px solid var(--line);}
  .stepper button{
    width:32px; height:34px; border:none; background:transparent; color:var(--fairway);
    font-size:18px; font-weight:700; cursor:pointer;
  }
  .stepper button:active{background:var(--line);}
  .stepper .val{
    width:34px; text-align:center; font-family:'IBM Plex Mono',monospace;
    font-weight:700; font-size:16px;
  }
  .val.over{color:var(--red);}
  .val.under{color:var(--green-score);}
  .pt-chip{
    min-width:26px; text-align:center; font-family:'IBM Plex Mono',monospace;
    font-size:12px; font-weight:700; color:var(--ink-soft); padding:3px 5px; border-radius:6px;
  }
  .pt-chip.has{background:var(--gold-soft); color:var(--fairway-dark);}

  /* Wolf selector */
  .wolf-section{margin-top:6px;}
  .wolf-label{
    display:flex; align-items:center; gap:6px; font-size:11px; font-weight:800;
    text-transform:uppercase; letter-spacing:.8px; color:var(--ink-soft); margin:14px 0 8px;
  }
  .wolf-label svg{width:14px; height:14px;}
  .pill-group{display:flex; flex-wrap:wrap; gap:7px;}
  .pill{
    padding:9px 13px; border-radius:20px; border:1.5px solid var(--line);
    background:var(--white); font-size:13px; font-weight:600; color:var(--ink);
    cursor:pointer;
  }
  .pill.selected{background:var(--fairway); border-color:var(--fairway); color:var(--white);}
  .pill.special{border-style:dashed;}
  .pill.special.selected{background:var(--gold); border-color:var(--gold); color:var(--fairway-dark);}

  .result-banner{
    margin-top:14px; border-radius:12px; padding:11px 12px;
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:700;
    display:flex; align-items:baseline; gap:6px;
    white-space:nowrap; overflow-x:auto;
  }
  .result-banner .rb-pts{flex-shrink:0;}
  .result-banner.wolf-win{background:#E4F1E7; color:var(--green-score);}
  .result-banner.other-win{background:#F7E9E4; color:var(--red);}
  .result-banner.tie{background:var(--parchment-dim); color:var(--ink-soft); white-space:normal;}
  .result-banner.pending{background:var(--parchment-dim); color:var(--ink-soft); font-weight:600; white-space:normal;}

  /* Bottom nav */
  .bottom-nav{
    position:sticky; bottom:0; z-index:30;
    display:flex; background:var(--fairway); border-top:1px solid rgba(255,255,255,.08);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  .nav-btn{
    flex:1; background:none; border:none; color:rgba(255,255,255,.55);
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 0;
    cursor:pointer; font-family:'Inter',sans-serif;
  }
  .nav-btn svg{width:20px; height:20px;}
  .nav-btn span{font-size:9.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;}
  .nav-btn.active{color:var(--gold-soft);}

  /* Grid / table view */
  .table-wrap{overflow-x:auto; border-radius:14px; border:1px solid var(--line);}
  table{border-collapse:collapse; width:100%; font-family:'IBM Plex Mono',monospace; font-size:11px; background:var(--white);}
  th,td{padding:5px 3px; text-align:center; border-bottom:1px solid var(--line); white-space:nowrap;}
  thead th{
    background:var(--fairway); color:var(--white); font-size:9px; text-transform:uppercase;
    letter-spacing:.3px; position:sticky; top:0;
  }
  td.name-col, th.name-col{text-align:left; position:sticky; left:0; background:var(--white); font-weight:700; padding-left:6px; padding-right:5px;}
  thead th.name-col{background:var(--fairway);}
  td.over{color:var(--red); font-weight:700;}
  td.under{color:var(--green-score); font-weight:700;}
  .mark{position:relative; display:inline-flex; align-items:center; justify-content:center; width:19px; height:18px; vertical-align:middle;}
  .mark svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}
  .mark-num{position:relative; z-index:1; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:10.5px;}
  .grid-legend{display:flex; flex-wrap:wrap; gap:12px; margin:2px 0 12px; font-size:11px; color:var(--ink-soft);}
  .grid-legend .li{display:flex; align-items:center; gap:6px;}
  .grid-legend .mark{width:20px; height:19px;}
  .grid-legend .mark-num{font-size:11px;}

  /* Leaderboard */
  .lb-row{
    display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line);
  }
  .lb-row:last-child{border-bottom:none;}
  .lb-rank{
    width:30px; height:30px; border-radius:50%; background:var(--parchment-dim);
    display:flex; align-items:center; justify-content:center;
    font-family:'Anton',sans-serif; font-size:14px; color:var(--fairway); flex-shrink:0;
  }
  .lb-rank.gold{background:var(--gold); color:var(--fairway-dark);}
  .lb-name{flex:1; font-weight:700; font-size:14.5px;}
  .lb-sub{font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}
  .lb-pts{font-family:'Anton',sans-serif; font-size:20px; color:var(--fairway); text-align:right; min-width:40px;}
  .lb-pts-lbl{font-size:9px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.5px; text-align:right;}
  .stat-group{display:flex; align-items:flex-end; gap:16px; flex-shrink:0;}
  .stat-block{text-align:center; min-width:30px;}
  .stat-block .stat-val{font-family:'Anton',sans-serif; font-size:16px; color:var(--ink-soft); line-height:1;}
  .stat-block .stat-lbl{font-size:8px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.4px; margin-top:3px;}
  .stat-block.emph .stat-val{font-size:21px; color:var(--fairway);}
  .stat-block.emph .stat-lbl{color:var(--ink-soft);}

  .empty-state{
    text-align:center; padding:50px 20px; color:var(--ink-soft);
  }
  .empty-state svg{width:52px; height:52px; opacity:.35; margin-bottom:12px;}
  .empty-state p{font-size:14px; margin:4px 0;}

  .round-card{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--white); border:1px solid var(--line); border-radius:14px;
    padding:14px; margin-bottom:10px; cursor:pointer;
  }
  .round-card:active{background:var(--parchment-dim);}
  .round-card .rc-course{font-weight:700; font-size:15px;}
  .round-card .rc-date{font-size:12px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}
  .status-tag{
    font-family:'Inter',sans-serif; font-size:9px; font-weight:800; text-transform:uppercase;
    letter-spacing:.5px; padding:2px 7px; border-radius:20px; margin-left:5px; vertical-align:middle;
    display:inline-block;
  }
  .status-tag.final{background:#E4F1E7; color:var(--green-score);}
  .status-tag.progress{background:var(--parchment-dim); color:var(--ink-soft);}
  .round-card svg{width:18px; height:18px; color:var(--ink-soft); flex-shrink:0;}

  .modal-overlay{
    position:absolute; inset:0; background:rgba(18,44,33,.55); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-sheet{
    background:var(--parchment); width:100%; max-width:520px;
    border-radius:20px 20px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    max-height:85vh; overflow-y:auto;
  }
  .modal-handle{width:36px; height:4px; background:var(--line); border-radius:3px; margin:0 auto 14px;}
  .modal-title{font-family:'Anton',sans-serif; font-size:18px; color:var(--fairway); margin:0 0 14px; text-transform:uppercase;}
  .season-toggle-row{display:flex; align-items:center; justify-content:space-between; padding:10px 2px;}
  .switch{position:relative; width:44px; height:25px; background:var(--line); border-radius:14px; cursor:pointer; flex-shrink:0;}
  .switch.on{background:var(--fairway-light);}
  .switch .knob{position:absolute; top:2px; left:2px; width:21px; height:21px; background:var(--white); border-radius:50%; transition:left .15s;}
  .switch.on .knob{left:21px;}

  .section-gap{height:6px;}
  .scoring-row{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .scoring-row .type-name{flex:1; font-size:13px; font-weight:700;}
  .scoring-row input{width:52px; text-align:center; padding:8px 4px;}
  .scoring-row .mini-lbl{font-size:10px; color:var(--ink-soft); width:44px;}

  .toast{
    position:absolute; bottom:76px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--white); padding:9px 16px; border-radius:20px;
    font-size:13px; font-weight:600; z-index:60; opacity:0; pointer-events:none;
    transition:opacity .25s;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";

/* ---------- constants ---------- */
const PLAYER_COLORS = ["#1B4332","#B23A2F","#8A6D1F","#2F5F8A"];
const DEFAULT_SCORING = {wolf:{team:1,other:1}, lone:{team:3,other:1}, blind:{team:6,other:2}};
const SEASON_PLACE_POINTS = [10,6,4,2]; // 1st,2nd,3rd,4th

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return "";
  const [y,m,d]=iso.split("-");
  const dt=new Date(+y,+m-1,+d);
  return dt.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
}
function initials(name){
  return (name||"?").trim().split(/\s+/).map(w=>w[0]).join("").toUpperCase().slice(0,2) || "?";
}

function emptyHole(idx){ return {scores:[null,null,null,null], wolf: idx % 4, partnerType:null, partnerIdx:null}; }

function newRound(){
  return {
    id: uid(),
    course: "",
    date: todayISO(),
    players: ["Player 1","Player 2","Player 3","Player 4"],
    playerInitials: ["","","",""], // blank = auto-derive from name
    startingPts: [0,0,0,0],
    pars: [4,4,4,4,4,4,4,4,4, 4,4,4,4,4,4,4,4,4],
    yardages: Array(18).fill(null),
    holes: Array.from({length:18}, (_,idx)=>emptyHole(idx)),
    scoringSplit: false,
    scoring: {
      front: JSON.parse(JSON.stringify(DEFAULT_SCORING)),
      back: JSON.parse(JSON.stringify(DEFAULT_SCORING))
    },
    locked: false,
    excludeFromSeason: false,
    createdAt: Date.now()
  };
}

function displayInitials(round, i){
  const custom = round.playerInitials && round.playerInitials[i];
  return (custom && custom.trim()) ? custom.trim().toUpperCase().slice(0,3) : initials(round.players[i]);
}

// Ensures older saved rounds (single flat scoring object, no startingPts) work with the newer front/back shape.
function normalizeRound(round){
  if(round.locked===undefined) round.locked = false;
  if(round.excludeFromSeason===undefined) round.excludeFromSeason = false;
  if(round.historical) return round;
  if(!round.scoring) round.scoring = {front: JSON.parse(JSON.stringify(DEFAULT_SCORING)), back: JSON.parse(JSON.stringify(DEFAULT_SCORING))};
  if(!round.scoring.front || !round.scoring.back){
    const legacy = round.scoring;
    round.scoring = { front: legacy, back: JSON.parse(JSON.stringify(legacy)) };
  }
  if(round.scoringSplit===undefined) round.scoringSplit = false;
  if(!round.startingPts) round.startingPts = [0,0,0,0];
  if(!round.playerInitials) round.playerInitials = ["","","",""];
  if(!round.yardages) round.yardages = Array(18).fill(null);
  return round;
}

// Uses Claude.ai's built-in storage when this file is running inside a Claude.ai artifact.
// When downloaded and opened elsewhere (self-hosted, or opened as a local file), that API
// doesn't exist, so this falls back to the browser's own localStorage instead. Either way the
// app calls storageAdapter, never window.storage or localStorage directly.
const USING_CLAUDE_STORAGE = typeof window.storage === "object" && window.storage !== null && typeof window.storage.get === "function";
const LOCAL_PREFIX = "wolf-scorecard:";
const storageAdapter = USING_CLAUDE_STORAGE ? window.storage : {
  async get(key){
    try{
      const raw = localStorage.getItem(LOCAL_PREFIX+key);
      return raw===null ? null : {key, value: raw, shared:false};
    }catch(e){ return null; }
  },
  async set(key, value){
    try{
      localStorage.setItem(LOCAL_PREFIX+key, value);
      return {key, value, shared:false};
    }catch(e){ return null; }
  },
  async delete(key){
    try{ localStorage.removeItem(LOCAL_PREFIX+key); return {key, deleted:true, shared:false}; }
    catch(e){ return null; }
  }
};

function getSyncDocRef(db, docFn){
  if(IS_STANDALONE) return docFn(db, STANDALONE_COLLECTION, STANDALONE_ID);

let firestoreUnsub = null;

async function loadFirebaseSdk(){
  if(firebaseMod) return firebaseMod;
  const [{ initializeApp }, firestore] = await Promise.all([
    import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")
  ]);
  const app = initializeApp(FIREBASE_CONFIG);
  const db = firestore.getFirestore(app);
  firebaseMod = { db, doc: firestore.doc, setDoc: firestore.setDoc, onSnapshot: firestore.onSnapshot };
  return firebaseMod;
}

let pendingRemoteRender = false;
async function initFirestoreSync(){
  try{
    const { db, doc, onSnapshot } = await loadFirebaseSdk();
    const ref = getSyncDocRef(db, doc);
    let announced = false;
    firestoreUnsub = onSnapshot(ref, (snap)=>{
      const data = snap.data();
      if(data && typeof data.payload === "string"){
        try{
          const parsed = JSON.parse(data.payload);
          rounds = parsed.rounds || {};
          roundOrder = parsed.roundOrder || Object.keys(rounds);
          Object.values(rounds).forEach(normalizeRound);
        }catch(e){ console.error("parse remote league data failed", e); }
      }
      syncStatus = "live";
      storageAdapter.set(ROUNDS_CACHE_KEY, JSON.stringify({rounds, roundOrder}));
      if(loaded){
        if(isModalOpen()) pendingRemoteRender = true;
        else render();
        if(!announced){ announced = true; showToast(IS_STANDALONE ? "Connected" : "Connected to your league"); }
      }
    }, (err)=>{
      console.error("firestore snapshot error", err);
      syncStatus = "error";
      if(loaded) render();
    });
  }catch(e){
    console.error("firestore init failed", e);
    syncStatus = "error";
    if(loaded) render();
  }
}

function saveRoundsShared(){
  clearTimeout(fsSaveTimer);
  fsSaveTimer = setTimeout(async ()=>{
    storageAdapter.set(ROUNDS_CACHE_KEY, JSON.stringify({rounds, roundOrder}));
    try{
      const { db, doc, setDoc } = await loadFirebaseSdk();
      const ref = getSyncDocRef(db, doc);
      await setDoc(ref, { payload: JSON.stringify({rounds, roundOrder}), updatedAt: Date.now() });
      syncStatus = "live";
    }catch(e){

async function loadState(){

  try{

      rounds = data.rounds || {};

/* ---------- wolf computation ---------- */
function computeHole(round, idx){
  const h = round.holes[idx];
  const scores = h.scores;
  const allEntered = scores.every(s => s!==null && s!==undefined && s!=="" && !isNaN(s));
  if(h.wolf===null || h.partnerType===null || !allEntered){
    return {ready:false};
  }
  const wolfIdx = h.wolf;
  let team1, type;
  if(h.partnerType==="player"){
    team1 = [wolfIdx, h.partnerIdx];
    type = "wolf";
  } else if(h.partnerType==="lone"){
    team1 = [wolfIdx];
    type = "lone";
  } else {
    team1 = [wolfIdx];
    type = "blind";
  }
  const team2 = [0,1,2,3].filter(i=>!team1.includes(i));
  const team1Score = Math.min(...team1.map(i=>Number(scores[i])));
  const team2Score = Math.min(...team2.map(i=>Number(scores[i])));
  const half = idx<9 ? "front" : "back";
  const cfg = round.scoring[half][type];
  let winner, points = [0,0,0,0];
  if(team1Score < team2Score){
    winner = "team1";
    team1.forEach(i=> points[i]=cfg.team);
  } else if(team2Score < team1Score){
    winner = "team2";
    team2.forEach(i=> points[i]=cfg.other);
  } else {
    winner = "tie";
  }
  return {ready:true, team1, team2, team1Score, team2Score, winner, points, type};
}

function computeRoundTotals(round){
  let totals;
  if(round.historical){
    totals = round.players.map((name,i)=>({
      idx:i, name,
      score: round.manualScores[i]!=null && round.manualScores[i]!=="" ? Number(round.manualScores[i]) : 0,
      scoreEntered: round.manualScores[i]!=null && round.manualScores[i]!=="",
      pts: round.manualPts[i]!=null && round.manualPts[i]!=="" ? Number(round.manualPts[i]) : 0,
      holesPlayed: (round.manualPts[i]!=null && round.manualPts[i]!=="") ? 1 : 0
    }));
  } else {
    const starting = round.startingPts || [0,0,0,0];
    totals = round.players.map((name,i)=>({
      idx:i, name, score:0, pts: Number(starting[i])||0, holesPlayed:0, scoreEntered:true, startingPts: Number(starting[i])||0
    }));
    round.holes.forEach((h, idx)=>{
      h.scores.forEach((s,i)=>{ if(s!==null && s!=="" && !isNaN(s)){ totals[i].score += Number(s); totals[i].holesPlayed++; } });
      const r = computeHole(round, idx);
      if(r.ready){ r.points.forEach((p,i)=> totals[i].pts += p); }
    });
  }
  // rank by wolf pts desc; ties broken by round golf score asc (lower score wins the tiebreak)
  const sorted = [...totals].sort((a,b)=> b.pts-a.pts || a.score-b.score);
  sorted.forEach((t,i)=>{
    if(i>0 && sorted[i-1].pts===t.pts && sorted[i-1].score===t.score){
      t.rank = sorted[i-1].rank;
    } else {
      t.rank = i+1;
    }
    t.seasonPoints = SEASON_PLACE_POINTS[t.rank-1] || 0;
  });
  const byIdx = {};
  totals.forEach(t=> byIdx[t.idx]=t);
  sorted.forEach(t=> { byIdx[t.idx].rank = t.rank; byIdx[t.idx].seasonPoints = t.seasonPoints; });
  return totals;
}

function getRoundYear(round){
  if(round && round.date){
    const y = parseInt(round.date.slice(0,4),10);
    if(!isNaN(y)) return y;
  }
  return new Date((round && round.createdAt) || Date.now()).getFullYear();
}

function getAvailableSeasonYears(){
  const set = new Set();
  roundOrder.forEach(id=>{ const r = rounds[id]; if(r) set.add(getRoundYear(r)); });
  set.add(new Date().getFullYear());
  return [...set].sort((a,b)=> b-a);
}

function isRoundComplete(round){
  if(round.historical){
    return round.manualPts.every(p=> p!=null && p!=="");
  }
  return round.holes.every(h=> h.scores.every(s=> s!==null && s!==""));
}

function computeSeasonTotals(year){
  const map = {}; // lowercased name -> {name, seasonPts, rounds, totalScore, wolfPts}
  roundOrder.forEach(id=>{
    const round = rounds[id];
    if(!round) return;
    if(round.excludeFromSeason) return;
    if(year!=null && getRoundYear(round)!==year) return;
    if(!isRoundComplete(round)) return;
    const totals = computeRoundTotals(round);
    totals.forEach(t=>{
      const key = t.name.trim().toLowerCase() || ("p"+t.idx);
      if(!map[key]) map[key] = {name:t.name, seasonPts:0, rounds:0, totalScore:0, wolfPts:0};
      map[key].seasonPts += t.seasonPoints;
      map[key].rounds += 1;
      map[key].totalScore += t.score;
      map[key].wolfPts += t.pts;
    });
  });
  return Object.values(map).sort((a,b)=> b.seasonPts-a.seasonPts);
}

/* ---------- rendering ---------- */
const app = document.getElementById("app");

function render(){
  const round = getCurrentRound();
  let headerHTML, mainHTML, navHTML="";

  if(round && round.historical && (activeTab==="card" || activeTab==="grid")){
    activeTab = "board";
  }

  if(IS_STANDALONE){
    if(!round){
      headerHTML = headerBar("Wolf Scorecard", "Shared round", false);
      mainHTML = `<div class="empty-state">${ICONS.flag}<p><strong>${loaded ? "Round not found" : "Loading…"}</strong></p><p>${loaded ? "This shared round link may be invalid, or it hasn't finished syncing yet — try reloading." : "Connecting to the shared round…"}</p></div>`;
    } else if(activeTab==="grid"){
      headerHTML = headerBar(round.course || "Untitled course", fmtDate(round.date), true, round.locked);
      mainHTML = renderGridView(round);
    } else if(activeTab==="board"){
      headerHTML = headerBar(round.course || "Untitled round", fmtDate(round.date), true, round.locked);
      mainHTML = renderBoardView(round);
    } else {
      headerHTML = headerBar(round.course || "Untitled course", fmtDate(round.date), true, round.locked);
      mainHTML = renderCardView(round);
    }
    navHTML = round ? renderBottomNav(false, round.historical, true) : "";
    app.innerHTML = headerHTML + `<main id="main">${mainHTML}</main>` + navHTML + `<div class="toast" id="toast"></div>`;
    attachHandlers();
    return;
  }

  if(activeTab==="rounds" || !round){
    headerHTML = headerBar("Wolf Scorecard","Round tracker", false);
    mainHTML = renderRoundsList();
  } else if(activeTab==="card"){
    headerHTML = headerBar(round.course || "Untitled course", fmtDate(round.date), true, round.locked);
    mainHTML = renderCardView(round);
  } else if(activeTab==="grid"){
    headerHTML = headerBar(round.course || "Untitled course", fmtDate(round.date), true, round.locked);
    mainHTML = renderGridView(round);
  } else if(activeTab==="board"){
    const sub = fmtDate(round.date) + (round.historical ? " · Historical" : "");
    headerHTML = headerBar(round.course || "Untitled round", sub, true, round.locked);
    mainHTML = renderBoardView(round);
  }

  if(round && activeTab!=="rounds"){
    navHTML = renderBottomNav(false, round.historical);
  } else {
    navHTML = renderBottomNav(true, false);
  }

  app.innerHTML = headerHTML + `<main id="main">${mainHTML}</main>` + navHTML + `<div class="toast" id="toast"></div>`;
  attachHandlers();
}

function renderBottomNav(disabled, isHistorical, hideRounds){
  const tabs = [
    {id:"card", icon:ICONS.card, label:"Scorecard"},
    {id:"grid", icon:ICONS.grid, label:"Grid"},
    {id:"board", icon:ICONS.trophy, label:"Leaders"},
    {id:"rounds", icon:ICONS.list, label:"Rounds"}
  ].filter(t=> !(hideRounds && t.id==="rounds"));
  return `<nav class="bottom-nav">
    ${tabs.map(t=>{
      const hideForHistorical = isHistorical && (t.id==="card" || t.id==="grid");
      const isDisabled = (disabled && t.id!=='rounds') || hideForHistorical;
      return `<button class="nav-btn ${activeTab===t.id?'active':''}" data-tab="${t.id}" ${isDisabled ? 'disabled style="opacity:.3;pointer-events:none;"':''}>${t.icon}<span>${t.label}</span></button>`;
    }).join("")}
  </nav>`;
}

function escapeHTML(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function renderRoundsList(){
  const years = getAvailableSeasonYears();
  const season = computeSeasonTotals(selectedSeasonYear);
  let html = "";

  html += `<div class="card">
    <div class="card-title">Season standings</div>
    <div class="pill-group" style="margin-bottom:${season.length?'12px':'2px'};">
      ${years.map(y=>`<button class="pill ${y===selectedSeasonYear?'selected':''}" data-select-year="${y}">${y}</button>`).join("")}
    </div>
    ${season.length ? season.map((p,i)=>`
        <div class="lb-row">
          <div class="lb-rank ${i===0?'gold':''}">${i+1}</div>
          <div>
            <div class="lb-name">${escapeHTML(p.name)}</div>
            <div class="lb-sub">${p.rounds} round${p.rounds===1?'':'s'} played</div>
          </div>
          <div style="flex:1"></div>
          <div>
            <div class="lb-pts">${p.seasonPts}</div>
            <div class="lb-pts-lbl">pts</div>
          </div>
        </div>`).join("") : `<p style="font-size:13px;color:var(--ink-soft);margin-top:8px;">No completed rounds recorded for the ${selectedSeasonYear} season yet.</p>`}
  </div>`;

  html += `<div style="font-family:'Anton',sans-serif;font-size:15px;letter-spacing:.4px;color:var(--fairway);text-transform:uppercase;margin:4px 0 10px;">${selectedSeasonYear} rounds</div>`;

  const roundsThisSeason = roundOrder.filter(id=> rounds[id] && getRoundYear(rounds[id])===selectedSeasonYear);

  if(!roundOrder.length){
    html += `<div class="empty-state">
      ${ICONS.flag}
      <p><strong>No rounds yet</strong></p>
      <p>Start a new round to track your Wolf game.</p>
    </div>`;
  } else if(!roundsThisSeason.length){
    html += `<div class="empty-state">
      ${ICONS.flag}
      <p><strong>No rounds in ${selectedSeasonYear}</strong></p>
      <p>Pick a different season above, or start a new round.</p>
    </div>`;
  } else {
    roundsThisSeason.forEach(id=>{
      const r = rounds[id];
      const totals = computeRoundTotals(r);
      const leader = [...totals].sort((a,b)=>b.pts-a.pts)[0];
      const complete = isRoundComplete(r);
      const topPts = leader ? leader.pts : 0;
      const tiedCount = totals.filter(t=>t.pts===topPts).length;
      let leaderText;
      if(topPts>0){
        leaderText = tiedCount>1
          ? (complete ? "Tied for first" : "Tied for the lead")
          : escapeHTML(leader.name) + (complete ? " wins" : " leads");
      } else {
        leaderText = complete ? "Final" : "Not started";
      }
      html += `<div class="round-card" data-open-round="${id}">
        <div>
          <div class="rc-course">${escapeHTML(r.course || (r.historical ? "Historical round" : "Untitled course"))} <span class="status-tag ${complete?'final':'progress'}">${complete?'Final':'In progress'}</span>${r.excludeFromSeason ? `<span class="status-tag progress" style="background:none; border:1px dashed var(--ink-soft);">Not in season</span>` : ""}${r.locked ? `<span style="display:inline-flex; width:12px; height:12px; vertical-align:middle; margin-left:5px; color:var(--gold);">${ICONS.lock}</span>` : ""}</div>
          <div class="rc-date">${fmtDate(r.date)} · ${leaderText}</div>
        </div>
        ${ICONS.chevR}
      </div>`;
    });
  }

  html += `<button class="btn btn-gold btn-block" id="btnCreateRound" style="margin-top:6px;">${ICONS.plus} New round</button>`;
  if(USING_CLAUDE_STORAGE){
    html += `<button class="btn btn-ghost btn-block" id="btnScanRound" style="margin-top:10px;">${ICONS.camera} Scan scorecard photo</button>`;
  }
  html += `<button class="btn btn-ghost btn-block" id="btnCreateHistorical" style="margin-top:10px;">${ICONS.clock} Add historical round</button>`;
  html += `<button class="btn btn-ghost btn-block" id="btnShareStandalone" style="margin-top:10px;">${ICONS.share} Share a one-off round</button>`;
  html += `<button class="btn btn-ghost btn-block" id="btnBackup" style="margin-top:10px;">${ICONS.download} Backup &amp; restore data</button>`;
  return html;
}

/* ----- Card (hole entry) view ----- */
function renderCardView(round){
  const idx = currentHole;
  const h = round.holes[idx];
  const par = round.pars[idx];
  const result = computeHole(round, idx);

  const dots = Array.from({length:18}, (_,i)=>{
    const filled = round.holes[i].scores.every(s=>s!==null && s!=="");
    return `<div class="dot ${i===idx?'active':(filled?'done':'')}" data-goto-hole="${i}"></div>`;
  }).join("");

  const scoreRows = round.players.map((name,i)=>{
    const val = h.scores[i];
    const diff = val!==null && val!=="" ? Number(val)-par : null;
    const cls = diff===null ? "" : (diff<0?"under":(diff>0?"over":""));
    const pts = result.ready ? result.points[i] : 0;
    return `
    <div class="score-row">
      <div class="p-tag" style="background:${PLAYER_COLORS[i]}">${escapeHTML(displayInitials(round,i))}</div>
      <div class="p-name">${escapeHTML(name)}</div>
      <div class="pt-chip ${pts>0?'has':''}">${result.ready ? (pts>0 ? '+'+pts : '—') : ''}</div>
      <div class="stepper ${round.locked?'locked-disabled':''}">
        <button data-score-dec="${i}">−</button>
        <div class="val ${cls}">${val===null||val===""?"–":val}</div>
        <button data-score-inc="${i}">+</button>
      </div>
    </div>`;
  }).join("");

  const otherPlayers = round.players.map((n,i)=>i).filter(i=> h.wolf!==null && i!==h.wolf);

  const wolfPills = round.players.map((name,i)=>
    `<button class="pill ${h.wolf===i?'selected':''}" data-set-wolf="${i}">${escapeHTML(name)}</button>`
  ).join("");

  let partnerPills = "";
  if(h.wolf!==null){
    partnerPills = otherPlayers.map(i=>
      `<button class="pill ${h.partnerType==='player' && h.partnerIdx===i?'selected':''}" data-set-partner="player" data-partner-idx="${i}">${escapeHTML(round.players[i])}</button>`
    ).join("") +
    `<button class="pill special ${h.partnerType==='lone'?'selected':''}" data-set-partner="lone">Lone Wolf</button>
     <button class="pill special ${h.partnerType==='blind'?'selected':''}" data-set-partner="blind">Blind Wolf</button>`;
  }

  let banner = "";
  if(result.ready){
    if(result.winner==="tie"){
      banner = `<div class="result-banner tie">Tie — no points this hole</div>`;
    } else {
      const winnerNames = (result.winner==="team1"?result.team1:result.team2).map(i=>round.players[i]);
      const winners = winnerNames.length<=2 ? winnerNames.join(" & ") : winnerNames.slice(0,-1).join(", ") + " & " + winnerNames[winnerNames.length-1];
      const half = idx<9 ? "front" : "back";
      const pts = result.winner==="team1" ? round.scoring[half][result.type].team : round.scoring[half][result.type].other;
      banner = `<div class="result-banner ${result.winner==='team1'?'wolf-win':'other-win'}">
        <span>${escapeHTML(winners)} win</span><span class="rb-pts">+${pts} each</span>
      </div>`;
    }
  } else if(h.wolf!==null && h.partnerType!==null){
    banner = `<div class="result-banner pending">Enter all 4 scores to see the result</div>`;
  }

  return `
    <div class="hole-nav">
      <button class="nav-arrow ${idx===0?'disabled':''}" id="btnPrevHole">${ICONS.chevL}</button>
      <div class="hole-badge" id="btnHolePicker"><div class="num">${idx+1}</div><div class="lbl">Hole</div></div>
      <div class="par-pill"><div class="p">${par}</div><div class="l">Par</div></div>
      <button class="nav-arrow ${idx===17?'disabled':''}" id="btnNextHole">${ICONS.chevR}</button>
    </div>
    <div class="hole-dots">${dots}</div>
    ${round.locked ? `<div class="locked-banner">${ICONS.lock} This round is locked — tap the lock icon in the header to make changes.</div>` : ""}
    <div class="card">
      ${scoreRows}
      <div class="wolf-section">
        <div class="wolf-label">${ICONS.wolf} Who's the Wolf?</div>
        <div class="pill-group ${round.locked?'locked-disabled':''}">${wolfPills}</div>
        ${h.wolf!==null ? `<div class="wolf-label">Partner</div><div class="pill-group ${round.locked?'locked-disabled':''}">${partnerPills}</div>` : ""}
        ${banner}
      </div>
    </div>
    <button class="btn btn-ghost btn-block" id="btnGoBoard">${ICONS.trophy} View leaderboard</button>
  `;
}

/* ----- Grid view (full scorecard) ----- */
function renderGridView(round){
  const totals = computeRoundTotals(round);
  const outPar = round.pars.slice(0,9).reduce((a,b)=>a+b,0);
  const inPar = round.pars.slice(9,18).reduce((a,b)=>a+b,0);
  const yardages = round.yardages || Array(18).fill(null);
  const hasYardage = yardages.some(y=> y!==null && y!==undefined && y!=="");
  const sumYds = (from,to)=>{
    let sum=0, any=false;
    for(let k=from;k<to;k++){ const y=yardages[k]; if(y!==null && y!==undefined && y!==""){ sum+=Number(y); any=true; } }
    return any ? sum : "–";
  };

  function markHTML(shape, value){
    let svg = "";
    if(shape==="circle"){
      svg = `<svg viewBox="0 0 26 24"><circle cx="13" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`;
    } else if(shape==="dcircle"){
      svg = `<svg viewBox="0 0 26 24"><circle cx="13" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="13" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>`;
    } else if(shape==="square"){
      svg = `<svg viewBox="0 0 26 24"><rect x="2" y="1.5" width="22" height="21" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`;
    } else if(shape==="dsquare"){
      svg = `<svg viewBox="0 0 26 24"><rect x="2" y="1.5" width="22" height="21" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="5.5" y="4.5" width="15" height="15" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>`;
    }
    return `<span class="mark">${svg}<span class="mark-num">${value}</span></span>`;
  }
  function scoreCell(i, hIdx){
    const s = round.holes[hIdx].scores[i];
    const par = round.pars[hIdx];
    if(s===null || s==="") return `<td class="name-col" style="text-align:center;font-weight:400;">–</td>`;
    const diff = Number(s)-par;
    const cls = diff<0?"under":(diff>0?"over":"");
    let shape = null;
    if(diff===-1) shape="circle";
    else if(diff<=-2) shape="dcircle";
    else if(diff===1) shape="square";
    else if(diff>=2) shape="dsquare";
    const content = shape ? markHTML(shape, s) : s;
    return `<td class="${cls}">${content}</td>`;
  }
  function sumRange(i, from, to){
    let sum=0, any=false;
    for(let k=from;k<to;k++){ const s=round.holes[k].scores[i]; if(s!==null && s!==""){ sum+=Number(s); any=true; } }
    return any? sum : "–";
  }

  const holeHeaderRow = (from,to)=> Array.from({length:to-from},(_,k)=>from+k+1).map(n=>`<th>${n}</th>`).join("");
  const parRow = (from,to)=> `<tr><td class="name-col">Par</td>${round.pars.slice(from,to).map(p=>`<td>${p}</td>`).join("")}<td><strong>${from===0?outPar:inPar}</strong></td></tr>`;
  const yardageRow = (from,to)=> `<tr><td class="name-col" style="font-weight:500; color:var(--ink-soft);">Yds</td>${yardages.slice(from,to).map(y=>`<td style="color:var(--ink-soft); font-weight:500;">${y===null||y===undefined||y===""?'–':y}</td>`).join("")}<td><strong>${sumYds(from,to)}</strong></td></tr>`;

  function playerRows(from,to){
    return round.players.map((name,i)=>{
      const cells = Array.from({length:to-from},(_,k)=>scoreCell(i, from+k)).join("");
      const sub = sumRange(i, from, to);
      return `<tr><td class="name-col"><span style="color:${PLAYER_COLORS[i]}">●</span> ${escapeHTML(displayInitials(round,i))}</td>${cells}<td><strong>${sub}</strong></td></tr>`;
    }).join("");
  }

  function wolfRows(from,to){
    return Array.from({length:to-from},(_,k)=>{
      const hIdx = from+k;
      const r = computeHole(round, hIdx);
      const h = round.holes[hIdx];
      let wolfName = h.wolf!==null ? round.players[h.wolf] : "–";
      let partnerName = "–";
      if(h.partnerType==="player") partnerName = round.players[h.partnerIdx];
      else if(h.partnerType==="lone") partnerName = "Lone Wolf";
      else if(h.partnerType==="blind") partnerName = "Blind Wolf";
      let resultTxt = "–", ptsTxt="";
      if(r.ready){
        if(r.winner==="tie"){ resultTxt="Tie"; }
        else{
          resultTxt = r.winner==="team1" ? "Wolf" : "Other";
          const half = hIdx<9 ? "front" : "back";
          ptsTxt = r.winner==="team1" ? round.scoring[half][r.type].team : round.scoring[half][r.type].other;
        }
      }
      return `<tr><td class="name-col">${hIdx+1}</td><td colspan="1">${escapeHTML(wolfName)}</td><td colspan="1">${escapeHTML(partnerName)}</td><td>${resultTxt}</td><td>${ptsTxt}</td></tr>`;
    }).join("");
  }

  return `
    <div class="card" style="padding:8px;">
      <div class="card-title">Scores</div>
      <div class="grid-legend">
        <div class="li">${markHTML("dcircle","")}<span>Eagle+</span></div>
        <div class="li">${markHTML("circle","")}<span>Birdie</span></div>
        <div class="li">${markHTML("square","")}<span>Bogey</span></div>
        <div class="li">${markHTML("dsquare","")}<span>Double+</span></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th class="name-col">Hole</th>${holeHeaderRow(0,9)}<th>Out</th></tr></thead>
          <tbody>${hasYardage ? yardageRow(0,9) : ""}${parRow(0,9)}${playerRows(0,9)}</tbody>
        </table>
      </div>
      <div style="height:10px;"></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th class="name-col">Hole</th>${holeHeaderRow(9,18)}<th>In</th></tr></thead>
          <tbody>${hasYardage ? yardageRow(9,18) : ""}${parRow(9,18)}${playerRows(9,18)}</tbody>
        </table>
      </div>
    </div>
    <div class="card" style="padding:8px;">
      <div class="card-title">Wolf log — front 9</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th class="name-col">#</th><th>Wolf</th><th>Partner</th><th>Winner</th><th>Pts</th></tr></thead>
          <tbody>${wolfRows(0,9)}</tbody>
        </table>
      </div>
      <div style="height:10px;"></div>
      <div class="card-title">Wolf log — back 9</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th class="name-col">#</th><th>Wolf</th><th>Partner</th><th>Winner</th><th>Pts</th></tr></thead>
          <tbody>${wolfRows(9,18)}</tbody>
        </table>
      </div>
    </div>
  `;
}

/* ----- Board (leaderboard) view ----- */
function renderBoardView(round){
  const totals = computeRoundTotals(round).sort((a,b)=> a.rank-b.rank);
  const roundYear = getRoundYear(round);
  const season = computeSeasonTotals(roundYear);
  const complete = isRoundComplete(round);
  const excluded = round.excludeFromSeason;

  return `
    <div class="card">
      <div class="card-title">This round ${complete ? '' : '<span style="color:var(--ink-soft); font-weight:600; text-transform:none; letter-spacing:0; font-size:11px;">· in progress</span>'}</div>
      ${excluded ? `<p style="font-size:12px; color:var(--ink-soft); margin:-6px 0 12px;">This round is set to not count toward season standings.</p>` : (!complete ? `<p style="font-size:12px; color:var(--ink-soft); margin:-6px 0 12px;">Season points are provisional and won't count toward standings until every score for this round is entered.</p>` : "")}
      ${totals.map(t=>`
        <div class="lb-row">
          <div class="lb-rank ${t.rank===1?'gold':''}">${t.rank}</div>
          <div style="flex:1;min-width:0;">
            <div class="lb-name">${escapeHTML(t.name)}</div>
            <div class="lb-sub">${round.historical ? "historical" : t.holesPlayed+"/18 holes"}</div>
          </div>
          <div class="stat-group">
            <div class="stat-block">
              <div class="stat-val">${t.scoreEntered ? t.score : '–'}</div>
              <div class="stat-lbl">score</div>
            </div>
            <div class="stat-block">
              <div class="stat-val">${t.pts}</div>
              <div class="stat-lbl">wolf pts</div>
            </div>
            <div class="stat-block emph">
              <div class="stat-val">${excluded ? '—' : (complete ? '+'+t.seasonPoints : (t.holesPlayed? '('+t.seasonPoints+')' : '–'))}</div>
              <div class="stat-lbl">${IS_STANDALONE ? 'placement' : 'season'}</div>
            </div>
          </div>
        </div>`).join("")}
    </div>
    ${IS_STANDALONE ? "" : `<div class="card">
      <div class="card-title">${roundYear} season standings</div>
      ${season.length ? season.map((p,i)=>`
        <div class="lb-row">
          <div class="lb-rank ${i===0?'gold':''}">${i+1}</div>
          <div>
            <div class="lb-name">${escapeHTML(p.name)}</div>
            <div class="lb-sub">${p.rounds} round${p.rounds===1?'':'s'}</div>
          </div>
          <div style="flex:1"></div>
          <div>
            <div class="lb-pts">${p.seasonPts}</div>
            <div class="lb-pts-lbl">pts</div>
          </div>
        </div>`).join("") : `<p style="font-size:13px;color:var(--ink-soft);">No completed rounds recorded for the ${roundYear} season yet.</p>`}
    </div>`}
  `;
}

function seasonOrderedNames(){
  const season = computeSeasonTotals(new Date().getFullYear());
  if(!season.length) return null;
  const reversed = [...season].reverse().map(p=>p.name); // last place first, leader last
  while(reversed.length<4) reversed.push("Player "+(reversed.length+1));
  return reversed.slice(0,4);
}

    locked: false,
    excludeFromSeason: false,
    createdAt: Date.now()
  };
}

/* ---------- settings/new-round modal ---------- */
function openHolePicker(round){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "modalOverlay";

  function gridHTML(from,to,label){
    const btns = Array.from({length:to-from},(_,k)=>{
      const i = from+k;
      const done = round.holes[i].scores.every(s=>s!==null && s!=="");
      const isCurrent = i===currentHole;
      return `<button class="hole-pick-btn ${done?'done':''} ${isCurrent?'current':''}" data-jump-hole="${i}">
        <span class="n">${i+1}</span>
        <span class="p">Par ${round.pars[i]}</span>
      </button>`;
    }).join("");
    return `<div class="hole-pick-divider">${label}</div><div class="hole-pick-grid">${btns}</div>`;
  }

  overlay.innerHTML = `
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title">Jump to hole</div>
      ${gridHTML(0,9,"Front 9")}
      ${gridHTML(9,18,"Back 9")}
      <button class="btn btn-ghost btn-block" id="hpCancel" style="margin-top:6px;">Cancel</button>
    </div>`;
  document.getElementById("app").appendChild(overlay);

  overlay.addEventListener("click", e=>{ if(e.target===overlay) closeOverlay(overlay); });
  document.getElementById("hpCancel").onclick = ()=> closeOverlay(overlay);
  overlay.querySelectorAll("[data-jump-hole]").forEach(el=>{
    el.onclick = ()=>{
      currentHole = parseInt(el.dataset.jumpHole,10);
      closeOverlay(overlay);
      render();
    };
  });
}

function openShareStandaloneModal(){
  let step = "form"; // form | creating | done
  let shareUrl = "";
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "modalOverlay";

  function paint(){
    let inner;
    if(step==="form"){
      const draftPlayers = ["Player 1","Player 2","Player 3","Player 4"];
      inner = `
        <div class="modal-handle"></div>

function resizeImageToBase64(file, maxDim, quality){
  maxDim = maxDim || 1568;
  quality = quality || 0.85;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h = Math.round(h*maxDim/w); w = maxDim; }
          else{ w = Math.round(w*maxDim/h); h = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality).split(",")[1]);
      };
      img.onerror = ()=> reject(new Error("Could not read image"));
      img.src = reader.result;
    };
    reader.onerror = ()=> reject(new Error("Could not read file"));
    reader.readAsDataURL(file);
  });
}

const SCORECARD_SCAN_PROMPT = `You are reading a photo or screenshot of a golf scorecard (this could be a blank/unplayed card showing just course info, or a fully filled-in card from a completed "Wolf" game round for 4 players). Extract what you can see and respond with ONLY valid JSON — no markdown, no code fences, no explanation, matching exactly this shape:
{
  "course": string or null,
  "date": "YYYY-MM-DD" or null,
  "players": [string, string, string, string],
  "holes": [ {"par": number or null, "yardage": number or null, "scores": [number|null, number|null, number|null, number|null]}, ... exactly 18 entries in hole order 1-18 ]
}
Rules:
- "players" should be the 4 player names/initials in the same left-to-right column order they appear on the card. Use "" for any you can't read, or if the card has no player scores at all (a blank course card), leave all four as "".
- "holes" must always have exactly 18 entries even if the card only shows 9 holes — leave unseen holes with par null, yardage null, and scores [null,null,null,null].
- "yardage" is the hole length/distance in yards (or meters if that's what the card shows) — usually a number like 150-600 printed near the par for each hole. Use null if not shown or unreadable.
- Each hole's "scores" array is in the same player column order as "players". If this is a blank course card with no scores filled in, every hole's "scores" should be [null,null,null,null].
- Only include numbers you can actually read; use null rather than guessing.
- Output raw JSON only, starting with { and ending with }.`;

async function scanScorecardImage(base64){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: "image/jpeg", data: base64 } },
          { type: "text", text: SCORECARD_SCAN_PROMPT }
        ]
      }]
    })
  });
  const data = await response.json();
  const text = (data.content || []).map(b=>b.text || "").join("").trim();
  const clean = text.replace(/^```json\s*|^```\s*|```$/g, "").trim();
  return JSON.parse(clean);
}

async function handleScorecardFile(file){
  showLoadingOverlay("Reading your scorecard…");
  try{
    const base64 = await resizeImageToBase64(file);
    const extracted = await scanScorecardImage(base64);
    const round = newRound();
    if(extracted.course && typeof extracted.course==="string") round.course = extracted.course.trim().slice(0,60);
    if(extracted.date && /^\d{4}-\d{2}-\d{2}$/.test(extracted.date)) round.date = extracted.date;
    if(Array.isArray(extracted.players)){
      extracted.players.slice(0,4).forEach((name,i)=>{
        if(typeof name==="string" && name.trim()) round.players[i] = name.trim().slice(0,24);
      });
    }
    if(Array.isArray(extracted.holes)){
      extracted.holes.slice(0,18).forEach((h,i)=>{
        if(!h) return;
        const par = parseInt(h.par,10);
        if(!isNaN(par) && par>=3 && par<=6) round.pars[i] = par;
        const yd = parseInt(h.yardage,10);
        if(!round.yardages) round.yardages = Array(18).fill(null);
        round.yardages[i] = (!isNaN(yd) && yd>=0 && yd<=700) ? yd : null;
        if(Array.isArray(h.scores)){
          const scores = h.scores.slice(0,4).map(s=>{
            const n = parseInt(s,10);
            return (!isNaN(n) && n>=1 && n<=15) ? n : null;
          });
          while(scores.length<4) scores.push(null);
          round.holes[i].scores = scores;
        }
      });
    }
    removeLoadingOverlay();
    openModal("new", round, true);
  }catch(e){
    console.error("scorecard scan failed", e);
    removeLoadingOverlay();
    showToast("Couldn't read that photo — try again or enter it manually");
  }
}

      ${round.players.map((name,i)=>`
        <div class="card" style="padding:10px 12px; margin-bottom:8px;">
          <div class="player-input-row" style="margin-bottom:8px;">
            <div class="player-swatch" style="background:${PLAYER_COLORS[i]}">${initials(name)}</div>
            <input type="text" class="h-name-input" data-pidx="${i}" value="${escapeHTML(name)}" placeholder="Player ${i+1} name">
          </div>
          <div class="field-row">
            <div class="field" style="margin-bottom:0;">
              <label class="field-label">Wolf pts</label>
              <input type="number" class="h-pts-input" data-pidx="${i}" value="${round.manualPts[i]===null?'':round.manualPts[i]}" placeholder="0">
            </div>
            <div class="field" style="margin-bottom:0;">
              <label class="field-label">Score (optional)</label>
              <input type="number" class="h-score-input" data-pidx="${i}" value="${round.manualScores[i]===null?'':round.manualScores[i]}" placeholder="–">
            </div>
          </div>
        </div>`).join("")}
      <div style="display:flex; gap:10px; margin-top:8px;">
        <button class="btn btn-ghost" id="hCancel" style="flex:1;">Cancel</button>
        ${mode!=="new" ? `<button class="btn btn-danger-ghost" id="hDelete" style="flex:1;">${ICONS.trash} Delete</button>` : ""}
        <button class="btn btn-primary" id="hSave" style="flex:1.4;">${mode==="new"?"Add round":"Save"}</button>
      </div>
    </div>`;
  document.getElementById("app").appendChild(overlay);

  overlay.addEventListener("click", e=>{ if(e.target===overlay) closeOverlay(overlay); });
  document.getElementById("hCancel").onclick = ()=> closeOverlay(overlay);

  const hLockToggle = document.getElementById("hLockToggle");
  if(hLockToggle){
    hLockToggle.onclick = ()=>{
      round.locked = true;
      saveState();
      closeOverlay(overlay);
      render();
      showToast("Round locked");
    };
  }

  const hExcludeToggle = document.getElementById("hExcludeToggle");
  hExcludeToggle.onclick = ()=>{
    round.excludeFromSeason = !round.excludeFromSeason;
    hExcludeToggle.classList.toggle("on", round.excludeFromSeason);
  };

  if(mode!=="new"){
    wireConfirmDelete(document.getElementById("hDelete"), ()=>{
      delete rounds[round.id];
      roundOrder = roundOrder.filter(id=>id!==round.id);
      if(currentRoundId===round.id) currentRoundId = null;
      activeTab = "rounds";
      saveState();
      closeOverlay(overlay);
      render();
    });
  }

  document.getElementById("hSave").onclick = ()=>{
    round.course = document.getElementById("hCourse").value.trim();
    round.date = document.getElementById("hDate").value || todayISO();
    overlay.querySelectorAll(".h-name-input").forEach(inp=>{
      round.players[+inp.dataset.pidx] = inp.value.trim() || ("Player "+(+inp.dataset.pidx+1));
    });
    overlay.querySelectorAll(".h-pts-input").forEach(inp=>{
      const v = inp.value.trim();
      round.manualPts[+inp.dataset.pidx] = v==="" ? null : Number(v);
    });
    overlay.querySelectorAll(".h-score-input").forEach(inp=>{
      const v = inp.value.trim();
      round.manualScores[+inp.dataset.pidx] = v==="" ? null : Number(v);
    });

    rounds[round.id] = round;
    if(!roundOrder.includes(round.id)) roundOrder.unshift(round.id);
    currentRoundId = round.id;
    activeTab = "board";
    saveState();
    closeOverlay(overlay);
    render();
    showToast(mode==="new" ? "Historical round added" : "Round saved");
  };
}

function showToast(msg){
  const t = document.getElementById("toast");
  if(!t) return;
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=> t.classList.remove("show"), 1600);
}

// Native confirm()/alert() dialogs are blocked inside the sandboxed artifact iframe, so destructive
// buttons use a tap-to-arm, tap-again-to-confirm pattern instead of window.confirm().
// Generic version of the arm-then-confirm pattern, used for the in-modal "Unlock round" buttons.
function wireConfirmButton(btn, confirmText, onConfirm){
  const originalHTML = btn.innerHTML;
  let armed = false, revertTimer = null;
  btn.onclick = ()=>{
    if(!armed){
      armed = true;
      btn.innerHTML = confirmText;
      btn.style.background = "var(--gold)";
      btn.style.color = "var(--fairway-dark)";
      revertTimer = setTimeout(()=>{
        armed = false;
        btn.innerHTML = originalHTML;
        btn.style.background = "";
        btn.style.color = "";
      }, 3000);
    } else {
      clearTimeout(revertTimer);
      onConfirm();
    }
  };
}

// The header's lock icon is too small to arm-in-place, so unlocking from there opens a quick confirm dialog instead.
function confirmUnlockRound(round){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "modalOverlay";
  overlay.innerHTML = `
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title">Unlock this round?</div>
      <p style="font-size:13px; color:var(--ink-soft); margin:-6px 0 16px;">Scores, Wolf picks, and settings can be changed again once it's unlocked.</p>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-ghost" id="ulCancel" style="flex:1;">Cancel</button>
        <button class="btn btn-primary" id="ulConfirm" style="flex:1.4;">${ICONS.unlock} Unlock round</button>
      </div>
    </div>`;
  document.getElementById("app").appendChild(overlay);
  overlay.addEventListener("click", e=>{ if(e.target===overlay) closeOverlay(overlay); });
  document.getElementById("ulCancel").onclick = ()=> closeOverlay(overlay);
  document.getElementById("ulConfirm").onclick = ()=>{
    round.locked = false;
    saveState();
    closeOverlay(overlay);
    render();
    showToast("Round unlocked");
  };
}

function wireConfirmDelete(btn, onConfirm){
  const originalHTML = btn.innerHTML;
  let armed = false, revertTimer = null;
  btn.onclick = ()=>{
    if(!armed){
      armed = true;
      btn.innerHTML = "Tap again to confirm";
      btn.style.background = "var(--red)";
      btn.style.color = "var(--white)";
      btn.style.borderColor = "var(--red)";
      revertTimer = setTimeout(()=>{
        armed = false;
        btn.innerHTML = originalHTML;
        btn.style.background = "";
        btn.style.color = "";
        btn.style.borderColor = "";
      }, 3000);
    } else {
      clearTimeout(revertTimer);
      onConfirm();
    }
  };
}

/* ---------- event wiring ---------- */
function attachHandlers(){
  const round = getCurrentRound();

  const btnNewRound = document.getElementById("btnNewRound");
  if(btnNewRound) btnNewRound.onclick = ()=> openModal("new");

  const btnCreateRound = document.getElementById("btnCreateRound");
  if(btnCreateRound) btnCreateRound.onclick = ()=> openModal("new");

  const btnScanRound = document.getElementById("btnScanRound");
  if(btnScanRound) btnScanRound.onclick = ()=>{
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.capture = "environment";
    input.onchange = ()=>{
      if(input.files && input.files[0]) handleScorecardFile(input.files[0]);
    };
    input.click();
  };

  const btnCreateHistorical = document.getElementById("btnCreateHistorical");
  if(btnCreateHistorical) btnCreateHistorical.onclick = ()=> openHistoricalModal("new");

  const btnShareStandalone = document.getElementById("btnShareStandalone");
  if(btnShareStandalone) btnShareStandalone.onclick = ()=> openShareStandaloneModal();

  const btnBackup = document.getElementById("btnBackup");
  if(btnBackup) btnBackup.onclick = ()=> openBackupModal();

  const btnSettings = document.getElementById("btnSettings");
  if(btnSettings) btnSettings.onclick = ()=> {
    const r = getCurrentRound();
    if(r && r.historical) openHistoricalModal("edit");
    else openModal("settings");
  };

  const btnLockToggle = document.getElementById("btnLockToggle");
  if(btnLockToggle) btnLockToggle.onclick = ()=>{
    const r = getCurrentRound();
    if(!r) return;
    if(r.locked){
      confirmUnlockRound(r);
    } else {
      r.locked = true;
      saveState();
      render();
      showToast("Round locked");
    }
  };

  document.querySelectorAll("[data-open-round]").forEach(el=>{
    el.onclick = ()=>{
      currentRoundId = el.dataset.openRound;
      const r = getCurrentRound();
      activeTab = (r && r.historical) ? "board" : "card";
      currentHole = 0;
      saveState();
      render();
    };
  });

  document.querySelectorAll("[data-select-year]").forEach(el=>{
    el.onclick = ()=>{
      selectedSeasonYear = parseInt(el.dataset.selectYear,10);
      render();
    };
  });

  document.querySelectorAll(".nav-btn").forEach(el=>{
    el.onclick = ()=>{
      activeTab = el.dataset.tab;
      render();
    };
  });

  const btnGoBoard = document.getElementById("btnGoBoard");
  if(btnGoBoard) btnGoBoard.onclick = ()=>{ activeTab="board"; render(); };

  if(!round) return;

  const btnPrev = document.getElementById("btnPrevHole");
  if(btnPrev) btnPrev.onclick = ()=>{ if(currentHole>0){ currentHole--; render(); } };
  const btnNext = document.getElementById("btnNextHole");
  if(btnNext) btnNext.onclick = ()=>{ if(currentHole<17){ currentHole++; render(); } };

  const btnHolePicker = document.getElementById("btnHolePicker");
  if(btnHolePicker) btnHolePicker.onclick = ()=> openHolePicker(round);

  document.querySelectorAll("[data-goto-hole]").forEach(el=>{
    el.onclick = ()=>{ currentHole = parseInt(el.dataset.gotoHole,10); render(); };
  });

  document.querySelectorAll("[data-score-inc]").forEach(el=>{
    el.onclick = ()=>{
      if(round.locked){ showToast("Round is locked"); return; }
      const i = parseInt(el.dataset.scoreInc,10);
      const h = round.holes[currentHole];
      const cur = h.scores[i];
      h.scores[i] = cur===null||cur===""? round.pars[currentHole] : Math.min(15, Number(cur)+1);
      saveState(); render();
    };
  });
  document.querySelectorAll("[data-score-dec]").forEach(el=>{
    el.onclick = ()=>{
      if(round.locked){ showToast("Round is locked"); return; }
      const i = parseInt(el.dataset.scoreDec,10);
      const h = round.holes[currentHole];
      const cur = h.scores[i];
      h.scores[i] = cur===null||cur===""? round.pars[currentHole] : Math.max(1, Number(cur)-1);
      saveState(); render();
    };
  });

  document.querySelectorAll("[data-set-wolf]").forEach(el=>{
    el.onclick = ()=>{
      if(round.locked){ showToast("Round is locked"); return; }
      const i = parseInt(el.dataset.setWolf,10);
      const h = round.holes[currentHole];
      h.wolf = i;
      if(h.partnerIdx===i) h.partnerIdx=null;
      if(h.partnerType==="player" && h.partnerIdx===null) h.partnerType=null;
      saveState(); render();
    };
  });

  document.querySelectorAll("[data-set-partner]").forEach(el=>{
    el.onclick = ()=>{
      if(round.locked){ showToast("Round is locked"); return; }
      const h = round.holes[currentHole];
      const type = el.dataset.setPartner;
      h.partnerType = type;
      h.partnerIdx = type==="player" ? parseInt(el.dataset.partnerIdx,10) : null;
      saveState(); render();
    };
  });
}

/* ---------- init ---------- */
(async function init(){
  app.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#F4EFDD;font-family:'Anton',sans-serif;letter-spacing:1px;">Loading…</div>`;
  await loadState();
  if(IS_STANDALONE){
    currentRoundId = STANDALONE_ID;
    currentHole = currentHole || 0;
    activeTab = "card";
  } else if(currentRoundId && rounds[currentRoundId]){
    activeTab = "card";
  } else {
    activeTab = "rounds";
  }
  render();
})();

})();
</script>
